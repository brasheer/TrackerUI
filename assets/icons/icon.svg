<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="96" fill="none" stroke="#334155" stroke-width="8"/>

  <!-- Main Board / Card -->
  <rect x="96" y="96" width="320" height="320" rx="36" fill="#1e293b" stroke="#38bdf8" stroke-width="8"/>
  
  <!-- Grid Lines / Spreadsheet Rows -->
  <line x1="96" y1="180" x2="416" y2="180" stroke="#334155" stroke-width="6"/>
  <line x1="96" y1="260" x2="416" y2="260" stroke="#334155" stroke-width="6"/>
  <line x1="96" y1="340" x2="416" y2="340" stroke="#334155" stroke-width="6"/>
  <line x1="200" y1="96" x2="200" y2="416" stroke="#334155" stroke-width="6"/>

  <!-- Header Accent Pill -->
  <rect x="126" y="126" width="50" height="26" rx="8" fill="url(#accentGrad)"/>
  <rect x="224" y="126" width="160" height="26" rx="8" fill="#334155"/>

  <!-- Row 1 Data Elements -->
  <circle cx="150" cy="220" r="14" fill="#38bdf8"/>
  <rect x="224" y="210" width="140" height="20" rx="6" fill="#f8fafc" opacity="0.9"/>

  <!-- Row 2 Data Elements -->
  <circle cx="150" cy="300" r="14" fill="url(#glowGrad)"/>
  <rect x="224" y="290" width="110" height="20" rx="6" fill="#f8fafc" opacity="0.9"/>

  <!-- Row 3 Data Elements -->
  <circle cx="150" cy="380" r="14" fill="#f59e0b"/>
  <rect x="224" y="370" width="160" height="20" rx="6" fill="#f8fafc" opacity="0.9"/>

  <!-- Magnifier / Tracking badge in lower-right corner -->
  <circle cx="370" cy="370" r="58" fill="#0f172a" stroke="#38bdf8" stroke-width="8"/>
  <circle cx="360" cy="360" r="24" fill="none" stroke="#38bdf8" stroke-width="7"/>
  <line x1="378" y1="378" x2="406" y2="406" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
</svg>
