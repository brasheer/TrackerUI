<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Tracker Workspace</title>

  <!-- PWA Meta & Manifest -->
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Support tracker and daily rollover workspace for agent Excel workbooks">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TrackerUI">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

  <!-- ExcelJS preserves cell styles, column widths, and hidden columns -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <div class="brand">
      <h1>Bidder Support Tracker PWA</h1>
      <span id="statusPill" class="status-pill">No File Linked</span>
    </div>
    <div style="display:flex; gap: 8px;">
      <button id="btnLinkFile">📂 Open Agent Tracker (.xlsx)</button>
      <button id="btnRollover" class="btn-rollover" style="display:none;">⏭️ Rollover Unfinished to Today</button>
      <button id="btnNewEntry" class="btn-primary" style="display:none;">+ New Request</button>
    </div>
  </header>

  <div class="controls">
    <label for="sheetSelect" style="color:var(--text-muted); font-size:12px;">Day Tab:</label>
    <select id="sheetSelect" disabled>
      <option>Load workbook first...</option>
    </select>

    <label for="scopeSelect" style="color:var(--text-muted); font-size:12px;">Search Scope:</label>
    <select id="scopeSelect" disabled>
      <option value="current">Current Day Tab Only</option>
      <option value="all">All Daily Tabs (Full History)</option>
    </select>

    <input type="text" id="searchInput" class="search-box" placeholder="Search Subject, Ticket #, Broker, Master #, Bidder #, Lot #, or Tracking ID..." disabled>
  </div>

  <div id="filterBanner">
    <div>
      <strong>History Trace Active:</strong> Showing all daily entries matching Key <code id="filterKeyText" style="color:var(--accent);"></code>
    </div>
    <button id="btnClearKeyFilter" style="padding: 4px 10px; font-size:12px;">Clear Key Filter</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Date Tab</th>
          <th>Key (Col K)</th>
          <th>Subject</th>
          <th>Ticket #</th>
          <th>Broker</th>
          <th>Master / Bidder</th>
          <th>Action</th>
          <th>Yard / Lots</th>
          <th>Action Notes</th>
          <th>Status</th>
          <th>Edit</th>
        </tr>
      </thead>
      <tbody id="listBody">
        <tr><td colspan="11" style="text-align:center; color:var(--text-muted); padding: 30px;">Click "Open Agent Tracker (.xlsx)" to load your workbook.</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Edit / Create Modal -->
  <div id="editModal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Edit Request</h3>
        <span id="modalKeyDisplay" class="key-chip" style="cursor:default;"></span>
      </div>
      <form id="entryForm">
        <div class="form-grid">
          <div class="form-group full">
            <label>Subject (Col A)</label>
            <input type="text" id="fSubject" required>
          </div>
          <div class="form-group">
            <label>Ticket Number (Col B)</label>
            <input type="text" id="fTicket" placeholder="Optional (uses fallback hash if blank)">
          </div>
          <div class="form-group">
            <label>Broker Name (Col C)</label>
            <input type="text" id="fBroker" list="brokerList" required>
            <datalist id="brokerList"></datalist>
          </div>
          <div class="form-group">
            <label>Master # (Col D)</label>
            <input type="text" id="fMaster">
          </div>
          <div class="form-group">
            <label>Bidder # (Col E)</label>
            <input type="text" id="fBidder">
          </div>
          <div class="form-group">
            <label>Requested Action (Col F)</label>
            <input type="text" id="fAction" list="actionList">
            <datalist id="actionList"></datalist>
          </div>
          <div class="form-group">
            <label>Request Status (Col J)</label>
            <select id="fStatus">
              <option value="Pending">Pending</option>
              <option value="In Progress">In Progress</option>
              <option value="Waiting on Buyer">Waiting on Buyer</option>
              <option value="Escalated">Escalated</option>
              <option value="Complete">Complete</option>
            </select>
          </div>
          <div class="form-group">
            <label>Yard # (Col G)</label>
            <input type="text" id="fYard">
          </div>
          <div class="form-group">
            <label>Lot Numbers (Col H)</label>
            <input type="text" id="fLots">
          </div>
          <div class="form-group full">
            <label>Action Notes (Col I)</label>
            <textarea id="fNotes" rows="4"></textarea>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" id="btnCancelModal">Cancel</button>
          <button type="submit" class="btn-primary">💾 Save to Workbook</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
